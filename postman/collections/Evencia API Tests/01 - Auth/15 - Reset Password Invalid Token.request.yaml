$kind: http-request
name: 'Reset Password Invalid Token (should fail)'
method: POST
url: '{{base_url}}/auth/reset-password'
order: 15000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "invalid-reset-token-12345",
      "newPassword": "ResetPassword12"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Error message indicates invalid or expired token", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("message");
          pm.expect(json.message.toLowerCase()).to.satisfy(function (msg) {
              return msg.includes("token") || msg.includes("invalide") || msg.includes("expir");
          });
      });
