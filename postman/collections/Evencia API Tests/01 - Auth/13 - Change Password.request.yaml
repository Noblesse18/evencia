$kind: http-request
name: Change Password
method: POST
url: '{{base_url}}/auth/change-password'
order: 13000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{participant_token}}'
body:
  type: json
  content: |-
    {
      "oldPassword": "{{participant_password}}",
      "newPassword": "{{new_password}}",
      "confirmPassword": "{{new_password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Success message returned", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("message");
          pm.expect(json.message.toLowerCase()).to.include("succes");
      });

      // Update the stored password for subsequent tests
      pm.test("Update stored password", function () {
          pm.environment.set("participant_password", pm.environment.get("new_password"));
      });
